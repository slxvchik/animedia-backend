services:
  db_content:
    container_name: animedia_backend_service_database
    image: postgres:18.0
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - animedia_backend_db_data:/var/lib/postgresql
    networks:
      - animedia_backend_service

volumes:
  animedia_backend_db_data:

networks:
  animedia_backend_service: