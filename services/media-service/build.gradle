plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-grpc'
    implementation 'io.quarkus:quarkus-flyway'
    implementation 'io.quarkus:quarkus-reactive-pg-client'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-arc'
    testImplementation 'io.quarkus:quarkus-junit'
}

group = 'dev.animedia'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.register('prepareLocalProtos', Copy) {
    from(file("../../protos/")) {
        include "common/v1/*.proto"
        include "dev/animedia/video/**/v1/*.proto"
    }
    into layout.buildDirectory.dir("tmp-protos")
}

quarkus {
    quarkusBuildProperties.put(
        "quarkus.grpc.codegen.proto-directory",
        layout.buildDirectory.dir("tmp-protos").get().asFile.absolutePath
    )
}

tasks.named('quarkusGenerateCode') {
    dependsOn 'prepareLocalProtos'
}

quarkusGenerateCode {
    inputs.dir(file("../../protos/"))
}