services:
  db:
    container_name: animedia_language_service_database
    image: postgres:18.0
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - animedia_language_service

volumes:
  db_data:

networks:
  animedia_language_service:

