services:

  web_comic:
    image: nginx:1.31
    container_name: animedia_comic_service_server
    environment:
      - NGINX_HOST=${NGINX_HOST}
      - NGINX_PORT=${NGINX_PORT}
    volumes:
      - ./nginx:/etc/nginx/templates/
      - ../src:/var/www/
    ports:
      - "${NGINX_PORT}:80"
    networks:
      - animedia_comic_service

  php_comic:
    build:
      context: ./
      dockerfile: ./php/Dockerfile
    container_name: animedia_comic_service_php_fpm
    restart: always
    working_dir: /var/www/
    volumes:
      - ../src:/var/www/
    networks:
      - animedia_comic_service

  db_comic:
    container_name: animedia_comic_service_database
    image: postgres:18.0
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data_comic:/var/lib/postgresql
    networks:
      - animedia_comic_service

volumes:
  db_data_comic:

networks:
  animedia_comic_service: