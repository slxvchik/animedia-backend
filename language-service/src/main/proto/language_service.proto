syntax = "proto3";

package language;

import "common.proto";

option java_multiple_files=true;
option java_package="dev.animedia.language.grpc";
option java_outer_classname="LanguageProto";

service LanguageService {
  rpc get(common.AppRequest) returns (common.AppResponse);
  rpc search(common.AppRequest) returns (common.AppResponse);

  rpc create(common.AppRequest) returns (common.AppResponse);
  rpc update(common.AppRequest) returns (common.AppResponse);
  rpc delete(common.AppRequest) returns (common.AppResponse);
}

message GetLanguageRequest {
  string code = 1;
}

message SearchLanguageRequest {
  repeated string codes = 1;
  repeated string names = 2;
  optional bool is_active = 3;
  optional common.PaginationRequest pagination = 4;
}

message CreateLanguageRequest {
  string code = 1;
  string name = 2;
  string native_name = 3;
  bool is_active = 4;
  int32 sort_order = 5;
  string flag_emoji = 6;
}

message UpdateLanguageRequest {
  string code = 1;
  optional string name = 2;
  optional string native_name = 3;
  optional bool is_active = 4;
  optional int32 sort_order = 5;
  optional string flag_emoji = 6;
}

message DeleteLanguageRequest {
  string code = 1;
}

message LanguageResponse {
  string code = 1;
  string name = 2;
  string native_name = 3;
  bool is_active = 4;
  bool is_default = 5;
  int32 sort_order = 6;
  string flag_emoji = 7;
}