syntax = "proto3";

package protos.services.content.core;

option java_package="dev.animedia.grpc.core";
option java_outer_classname="ContentCommonProto";

enum ContentType {
  MOVIE = 0;
  SERIES = 1;
  COMIC = 2;
  BOOK = 3;
}

enum SortBy {
  RELEASE_DATE = 0;
  CREATED_AT = 1;
  UPDATED_AT = 2;
  SORT = 3;
}

message ContentTranslationResponse {
  string uuid = 1;
  string content_uuid = 2;
  string language_code = 3;
  string title = 4;
  string description = 5;
}