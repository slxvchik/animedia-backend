syntax = "proto3";

package protos.services.content.core;

import "common/common.proto";

option java_package="dev.animedia.grpc.core";
option java_outer_classname="ContentCommonProto";

enum ContentType {
  MOVIE = 0;
  SERIES = 1;
  COMIC = 2;
  BOOK = 3;
}

enum SortBy {
  SORT = 0;
  RELEASE_DATE = 1;
  CREATED_AT = 2;
  UPDATED_AT = 3;
}

message Sort {
  SortBy sort_by = 1;
  protos.common.SortType sort_type = 2;
}

message ContentTranslationResponse {
  string uuid = 1;
  string content_uuid = 2;
  string language_code = 3;
  string title = 4;
  string description = 5;
}