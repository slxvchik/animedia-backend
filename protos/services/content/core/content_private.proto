syntax = "proto3";

package protos.services.content.core;

import "google/protobuf/timestamp.proto";
import "common/common.proto";
import "services/content/core/content_common.proto";
import "services/content/status/content_status_common.proto";
import "services/content/genre/genre_common.proto";

option java_package="dev.animedia.grpc.core";
option java_outer_classname="ContentPrivateProto";

service ContentPrivateService {
  rpc search(SearchRequest) returns (SearchResponse);
  rpc create(CreateRequest) returns (ContentPrivateResponse);
  rpc update(UpdateRequest) returns (ContentPrivateResponse);
  rpc delete(DeleteRequest) returns (common.EmptyResponse);
}

message SearchRequest {
  optional string uuid = 1;
  optional string alias = 2;
  repeated ContentType type = 3;
  repeated int32 seasons = 4;
  repeated int64 content_status_ids = 5;
  optional google.protobuf.Timestamp release_date_from = 6;
  optional google.protobuf.Timestamp release_date_to = 7;
  optional google.protobuf.Timestamp created_at_from = 8;
  optional google.protobuf.Timestamp created_at_to = 9;
  optional google.protobuf.Timestamp updated_at_from = 10;
  optional google.protobuf.Timestamp updated_at_to = 11;
  optional bool active = 12;
  repeated string language_codes = 13;
  optional SortBy sort = 14;
  optional protos.common.PaginationRequest pagination = 15;
}

enum SortBy {
  RELEASE_DATE = 0;
  CREATED_AT = 1;
  UPDATED_AT = 2;
  SORT = 3;
}

message SearchResponse {
  repeated ContentPrivateResponseWithTranslations contents = 1;
  common.PaginationResponse pagination = 2;
}

message CreateRequest {
  string alias = 1;
  ContentType type = 2;
  int32 season = 3;
  protos.services.content.status.ContentStatusWithTranslationResponse status = 4;
  string cover_url = 5;
  string trailer_url = 6;
  google.protobuf.Timestamp release_date = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  bool active = 10;
  repeated string language_codes = 11;
  repeated protos.services.content.genre.GenreWithTranslationResponse genres = 12;
}

message UpdateRequest {
  string uuid = 1;
  string alias = 2;
  ContentType type = 3;
  int32 season = 4;
  protos.services.content.status.ContentStatusWithTranslationResponse status = 5;
  string cover_url = 6;
  string trailer_url = 7;
  google.protobuf.Timestamp release_date = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool active = 11;
  repeated string language_codes = 12;
  repeated protos.services.content.genre.GenreWithTranslationResponse genres = 13;
}

message DeleteRequest {
  string uuid = 1;
}

message ContentPrivateResponse {
  string uuid = 1;
  string alias = 2;
  ContentType type = 3;
  int32 season = 4;
  protos.services.content.status.ContentStatusWithTranslationResponse status = 5;
  string cover_url = 6;
  string trailer_url = 7;
  google.protobuf.Timestamp release_date = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool active = 11;
  repeated string language_codes = 12;
  repeated protos.services.content.genre.GenreWithTranslationResponse genres = 13;
}

message ContentPrivateResponseWithTranslations {
  ContentPrivateResponse content = 1;
  repeated ContentTranslationResponse translations = 2;
}