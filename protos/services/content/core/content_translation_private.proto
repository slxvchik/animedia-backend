syntax = "proto3";

package protos.services.content.core;

import "common/common.proto";
import "services/content/core/content_common.proto";

option java_package="dev.animedia.grpc.core";
option java_outer_classname="ContentTranslationPrivateProto";

service ContentPrivateService {
  rpc search(SearchRequest) returns (SearchResponse);
  rpc create(CreateRequest) returns (ContentTranslationResponse);
  rpc update(UpdateRequest) returns (ContentTranslationResponse);
  rpc delete(DeleteRequest) returns (common.EmptyResponse);
}

message SearchRequest {
  repeated string content_uuid = 1;
  repeated string language_codes = 2;
  optional common.PaginationRequest pagination = 3;
}

message SearchResponse {
  repeated ContentTranslationResponse content_translations = 1;
  common.PaginationResponse pagination = 2;
}

message CreateRequest {
  string content_uuid = 2;
  string language_code = 3;
  string title = 4;
  optional string description = 5;
}

message UpdateRequest {
  string uuid = 1;
  string title = 2;
  optional string description = 3;
}

message DeleteRequest {
  string uuid = 1;
}