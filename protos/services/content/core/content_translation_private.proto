syntax = "proto3";

package protos.services.content.core;

import "common/common.proto";
import "services/content/core/content_common.proto";

option java_package="dev.animedia.grpc.core";
option java_outer_classname="PrivateContentTranslationProto";

service PrivateContentTranslationService {
  rpc search(PrivateTranslationSearchRequest) returns (PrivateTranslationSearchResponse);
  rpc create(PrivateTranslationCreateRequest) returns (ContentTranslationResponse);
  rpc update(PrivateTranslationUpdateRequest) returns (ContentTranslationResponse);
  rpc delete(PrivateTranslationDeleteRequest) returns (common.EmptyResponse);
}

message PrivateTranslationSearchRequest {
  repeated string content_uuid = 1;
  repeated string language_codes = 2;
  optional common.PaginationRequest pagination = 3;
}

message PrivateTranslationSearchResponse {
  repeated ContentTranslationResponse content_translations = 1;
  common.PaginationResponse pagination = 2;
}

message PrivateTranslationCreateRequest {
  string content_uuid = 1;
  string language_code = 2;
  string title = 3;
  optional string description = 4;
}

message PrivateTranslationUpdateRequest {
  string uuid = 1;
  string title = 2;
  optional string description = 3;
}

message PrivateTranslationDeleteRequest {
  string uuid = 1;
}