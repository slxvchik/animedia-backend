syntax = "proto3";

package protos.services.content.status;

import "common/common.proto";
import "services/content/status/content_status_common.proto";

service ContentStatusPublicService {
  rpc search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string language_code = 1;
  repeated string aliases = 2;
  repeated string names = 3;
  common.PaginationRequest pagination = 4;
}

message SearchResponse {
    ContentStatusWithTranslation content_statuses = 1;
    common.PaginationResponse pagination = 2;
}

message ContentStatusWithTranslation {
  ContentStatusResponse content_status = 1;
  ContentStatusTranslationResponse translation = 2;
}