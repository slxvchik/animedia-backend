syntax = "proto3";

package protos.services.content.status;

option java_package="dev.animedia.grpc.status";
option java_outer_classname="ContentStatusCommonProto";

message ContentStatusResponse {
  int64 id = 1;
  string alias = 2;
}

message ContentStatusTranslationResponse {
  int64 id = 1;
  int64 content_status_id = 2;
  string language_code = 3;
  string name = 4;
}

message ContentStatusWithTranslationResponse {
  ContentStatusResponse content_status = 1;
  ContentStatusTranslationResponse translation = 2;
}

message ContentStatusWithTranslationsResponse {
  ContentStatusResponse content_status = 1;
  repeated ContentStatusTranslationResponse translations = 2;
}