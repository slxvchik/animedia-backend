syntax = "proto3";

package protos.services.content.status;

import "common/common.proto";

option java_package="dev.animedia.grpc.status";
option java_outer_classname="PrivateContentStatusProto";

service PrivateContentStatusService {
  rpc search(PrivateSearchStatusRequest) returns (PrivateSearchStatusResponse);
  rpc get(GetStatusRequest) returns (PrivateStatusResponse);
  rpc create(CreateStatusRequest) returns (PrivateStatusResponse);
  rpc update(UpdateStatusRequest) returns (PrivateStatusResponse);
  rpc delete(DeleteStatusRequest) returns (common.EmptyResponse);
}

message PrivateStatusResponse {
  string uuid = 1;
  string alias = 2;
  int32 sort_order = 3;
  bool active = 4;
  repeated PrivateStatusTranslationResponse translations = 5;
}

message PrivateStatusTranslationResponse {
  string uuid = 1;
  string content_status_uuid = 2;
  string language_code = 3;
  string name = 4;
}

message PrivateSearchStatusRequest {
  optional bool active = 1;
  optional string alias = 2;
  optional string name = 3;
  optional string language_code = 4;
  optional common.PaginationRequest pagination = 5;
}

message PrivateSearchStatusResponse {
  repeated PrivateStatusResponse statuses = 1;
  common.PaginationResponse pagination = 2;
}

message GetStatusRequest {
  string uuid = 1;
}

message CreateStatusRequest {
  string alias = 1;
  int32 sort_order = 2;
  bool active = 3;
  repeated CreateStatusTranslationRequest translations = 4;
}

message CreateStatusTranslationRequest {
  string language_code = 1;
  string name = 2;
}

message UpdateStatusRequest {
  string uuid = 1;
  int32 sort_order = 2;
  bool active = 3;
  repeated UpdateStatusTranslationRequest translations = 4;
}

message UpdateStatusTranslationRequest {
  optional string uuid = 1;
  string language_code = 2;
  string name = 3;
}

message DeleteStatusRequest {
  string uuid = 1;
}