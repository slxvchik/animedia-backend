syntax = "proto3";

package protos.services.content.genre;

import "common/common.proto";
import "services/content/genre/genre_common.proto";

option java_package="dev.animedia.grpc.genre";
option java_outer_classname="PublicGenreProto";

service PublicGenreService {
    rpc search(PublicSearchRequest) returns (SearchGenreResponse);
}

message PublicSearchRequest {
    repeated string alias = 1;
    repeated string name = 2;
    optional common.PaginationRequest pagination = 3;
}