syntax = "proto3";

package protos.services.content.genre;

import "common/common.proto";

option java_package="dev.animedia.grpc.genre";
option java_outer_classname="GenreCommonProto";

message GenreResponse {
    int64 id = 1;
    string alias = 2;
    int64 sort_order = 3;
    bool active = 4;
    repeated GenreTranslationResponse translation = 5;
}

message GenreTranslationResponse {
    int64 id = 1;
    int64 genre_id = 2;
    string language_code = 3;
    string name = 4;
    string description = 5;
}

message SearchGenreResponse {
    repeated GenreResponse genres = 1;
    common.PaginationResponse pagination = 2;
}