syntax = "proto3";

package protos.services.language;

import "common/common.proto";

option java_package="dev.animedia.grpc.language";
option java_outer_classname="LanguageProto";

service LanguageService {
  rpc get(GetLanguageRequest) returns (LanguageResponse);
  rpc search(SearchLanguageRequest) returns (common.PaginationResponse);

  rpc create(LanguageRequest) returns (LanguageResponse);
  rpc update(LanguageRequest) returns (LanguageResponse);
  rpc delete(DeleteLanguageRequest) returns (common.EmptyResponse);
}

message GetLanguageRequest {
  string code = 1;
}

message SearchLanguageRequest {
  repeated string codes = 1;
  repeated string names = 2;
  optional bool is_active = 3;
  optional common.PaginationRequest pagination = 4;
}

message LanguageRequest {
  string code = 1;
  string name = 2;
  optional bool is_active = 3;
  optional bool is_default = 4;
  optional int32 sort_order = 5;
  string flag_emoji = 6;
}

message DeleteLanguageRequest {
  string code = 1;
}

message LanguageResponse {
  string code = 1;
  string name = 2;
  bool is_active = 3;
  bool is_default = 4;
  int32 sort_order = 5;
  string flag_emoji = 6;
}