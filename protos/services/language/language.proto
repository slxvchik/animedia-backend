syntax = "proto3";

package protos.services.language;

import "common/common.proto";

option java_package="dev.animedia.grpc.language";
option java_outer_classname="LanguageProto";

service LanguageService {
  rpc get(GetLanguageRequest) returns (LanguageResponse);
  rpc search(SearchLanguageRequest) returns (LanguageListResponse);

  rpc create(CreateLanguageRequest) returns (LanguageResponse);
  rpc update(UpdateLanguageRequest) returns (LanguageResponse);
  rpc delete(DeleteLanguageRequest) returns (common.EmptyResponse);
}

message GetLanguageRequest {
  string code = 1;
}

message SearchLanguageRequest {
  repeated string codes = 1;
  repeated string native_names = 2;
  optional bool is_active = 3;
  optional common.PaginationRequest pagination = 4;
}

message CreateLanguageRequest {
  string code = 1;
  string name = 2;
  string native_name = 3;
  optional bool is_active = 4;
  optional bool is_default = 5;
  optional int32 sort_order = 6;
  string flag_emoji = 7;
}

message UpdateLanguageRequest {
  string code = 1;
  string name = 2;
  string native_name = 3;
  optional bool is_active = 4;
  optional bool is_default = 5;
  optional int32 sort_order = 6;
  string flag_emoji = 7;
}

message DeleteLanguageRequest {
  string code = 1;
}

message LanguageResponse {
  string code = 1;
  string name = 2;
  string native_name = 3;
  bool is_active = 4;
  bool is_default = 5;
  int32 sort_order = 6;
  string flag_emoji = 7;
}

message LanguageListResponse {
  repeated LanguageResponse languages = 1;
  common.PaginationResponse pagination = 2;
}