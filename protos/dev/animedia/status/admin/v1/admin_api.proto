syntax = "proto3";

package dev.animedia.status.admin.v1;

import "common/v1/common.proto";
import "dev/animedia/status/admin/v1/admin.proto";

option java_package="dev.animedia.grpc.status.admin.v1";
option java_outer_classname="StatusAdminProtoApi";

service StatusAdminService {
  rpc GetAll(common.v1.PaginationRequest) returns (GetAllStatusResponse);
  rpc Get(GetStatusRequest) returns (StatusResponse);
  rpc Create(CreateStatusRequest) returns (CreateStatusResponse);
  rpc Update(UpdateStatusRequest) returns (common.v1.EmptyResponse);
  rpc Delete(DeleteStatusRequest) returns (common.v1.EmptyResponse);
}
message GetAllStatusResponse {
  repeated StatusResponse statuses = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetStatusRequest {
  string id = 1;
}

message CreateStatusRequest {
  string alias = 1;
  int32 sort_order = 2;
  bool active = 3;
  repeated CreateStatusTranslationRequest translations = 4;
}

message CreateStatusTranslationRequest {
  string language_code = 1;
  string name = 2;
}

message CreateStatusResponse {
  string id = 1;
}

message UpdateStatusRequest {
  string id = 1;
  int32 sort_order = 2;
  bool active = 3;
  repeated UpdateStatusTranslationRequest translations = 4;
}

message UpdateStatusTranslationRequest {
  optional string id = 1;
  string language_code = 2;
  string name = 3;
}

message DeleteStatusRequest {
  string id = 1;
}