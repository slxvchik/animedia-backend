syntax = "proto3";

package dev.animedia.status.user.v1;

option java_package="dev.animedia.grpc.status.user.v1";
option java_outer_classname="StatusUserProto";

message StatusResponse {
  string alias = 1;
  int32 sort_order = 2;
  repeated StatusTranslationResponse translations = 3;
}

message StatusTranslationResponse {
  string language_code = 1;
  string name = 2;
}