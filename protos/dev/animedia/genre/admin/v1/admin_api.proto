syntax = "proto3";

package dev.animedia.genre.admin.v1;

import "common/v1/common.proto";
import "dev/animedia/genre/admin/v1/admin.proto";

option java_package="dev.animedia.grpc.genre.admin.v1";
option java_outer_classname="GenreAdminProtoApi";

service GenreAdminService {
    rpc GetAll(common.v1.PaginationRequest) returns (GetAllGenreResponse);
    rpc Get(GetGenreRequest) returns (GenreResponse);
    rpc Create(CreateGenreRequest) returns (GenreResponse);
    rpc Update(UpdateGenreRequest) returns (GenreResponse);
    rpc Delete(DeleteGenreRequest) returns (common.v1.EmptyResponse);
}

message GetAllGenreResponse {
    repeated GenreResponse genres = 1;
    common.v1.PaginationResponse pagination = 2;
}

message GetGenreRequest {
    string uuid = 1;
}

message CreateGenreRequest {
    string alias = 1;
    int32 sort_order = 2;
    bool active = 3;
    repeated CreateGenreTranslationRequest translations = 4;
}

message CreateGenreTranslationRequest {
    string language_code = 1;
    string name = 2;
    optional string description = 3;
}

message UpdateGenreRequest {
    string uuid = 1;
    int32 sort_order = 3;
    bool active = 4;
    repeated UpdateGenreTranslationRequest translations = 5;
}

message UpdateGenreTranslationRequest {
    optional string uuid = 1;
    string language_code = 2;
    string name = 3;
    optional string description = 4;
}

message DeleteGenreRequest {
    string uuid = 1;
}