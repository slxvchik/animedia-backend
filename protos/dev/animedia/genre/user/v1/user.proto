syntax = "proto3";

package dev.animedia.genre.user.v1;

option java_package="dev.animedia.grpc.genre.user.v1";
option java_outer_classname="GenreUserProto";

message GenreResponse {
  string alias = 1;
  int32 sort_order = 2;
  repeated GenreTranslationResponse translations = 3;
}

message GenreTranslationResponse {
  string language_code = 1;
  string name = 2;
  optional string description = 3;
}